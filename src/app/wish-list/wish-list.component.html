<div class="wishListWrapper container-xl">
    <div class="firstRow ">
        <p>Wishlist ({{this.wishCounter}})</p>
        <button (click)="moveAllToBag()"><span>Move All To Bag</span></button>
    </div>
    <div class="wishProductsWrapper  mb-5">

        <div class="cardWrapper col-auto" *ngFor="let product of wishListProducts">

            <div class="card" style="width: 14rem;">
                <img [src]="product.mainImg" class="card-img-top" (click)="productNavigate(product.id)"
                    alt="{{product.name}}">
                <button class="addCart" (click)="addCartHandler(product)"><i class="fa-solid fa-cart-shopping me-2"
                        style="color: white;"></i>Add To
                    Cart</button>
                <button class="eye" (click)="removeProduct(product)"><i class="fa-regular fa-trash-can"
                        style="color: #000000;"></i></button>
                <p class="discount">{{product.discount}}</p>

            </div>
            <div class="card-body">
                <h4>{{product.title}}</h4>
                <div class="priceWrapper">

                    <p class="card-text">${{product.price}}</p>
                    <p class="priceBefore">${{product.prevPrice}}</p>

                </div>
                <div class="reviews">

                    <div class="stars">
                        @for (star of getFilledStars(product); track $index) {
                        <i class="fa-solid fa-star" style="color: #ffad33;"></i>
                        }
                        @for (star of getEmptyStars(product); track $index) {
                        <i class="fa-solid fa-star" style="color: #bfbfbf;"></i>
                        }
                    </div>
                    <div class="reviewsCount">
                        <p style="color: #bfbfbf;">({{ product.ratingsQuantity }})</p>
                    </div>
                </div>
            </div>


        </div>

    </div>
</div>
